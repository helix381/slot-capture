[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slot-capture-local"
version = "0.2.3"
description = "Passive local Slot capture controller with a JSON CLI"
requires-python = ">=3.11"
dependencies = ["dpkt==1.9.8", "psutil>=7,<8", "Pillow>=11,<13", "tkinterdnd2==0.4.3"]

[project.scripts]
slot-capture = "slotcapture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
